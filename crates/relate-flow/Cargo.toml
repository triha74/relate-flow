[package]
name = "relate-flow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Stateless CLI over the relate-flow plan admission library"

[[bin]]
name = "relate-flow"
path = "src/main.rs"

[dependencies]
relate-flow-core = { path = "../relate-flow-core" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
humantime = "2"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json"] }
tempfile = "3"
serde_json = "1"
